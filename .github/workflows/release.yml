name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: python -m pip install --upgrade build twine
      - name: Validate release metadata
        run: python scripts/validate_release.py --tag "${GITHUB_REF_NAME}"
      - name: Build and inspect distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Test installed wheel
        run: python scripts/test_installed_package.py
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/freelance-dev-suite/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  post-publish-smoke:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the published release from PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          python -m venv .pypi-smoke
          for attempt in 1 2 3 4 5 6; do
            if .pypi-smoke/bin/python -m pip install \
              --disable-pip-version-check \
              --no-cache-dir \
              --only-binary=:all: \
              --index-url https://pypi.org/simple \
              "freelance-dev-suite==${version}"; then
              break
            fi
            if [ "${attempt}" -eq 6 ]; then
              echo "Release ${version} did not become installable from PyPI in time." >&2
              exit 1
            fi
            sleep 10
          done
          .pypi-smoke/bin/python -c \
            "from importlib.metadata import version; assert version('freelance-dev-suite') == '${version}'"
          .pypi-smoke/bin/freelance --version
          .pypi-smoke/bin/freelance --help >/dev/null

  github-release:
    needs: post-publish-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --generate-notes
          --verify-tag
